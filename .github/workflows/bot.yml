name: bot-telegram

on:
  schedule:
    - cron: "*/5 * * * *"   # ogni 5 minuti controlla se hai scritto /scan su Telegram
  workflow_dispatch:

# una sola esecuzione alla volta (una scansione lunga non viene interrotta)
concurrency:
  group: bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python bot.py poll
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      - name: salva stato
        if: always()
        run: |
          if [ -n "$(git status --porcelain state 2>/dev/null)" ]; then
            git config user.name "affari-bot"
            git config user.email "affari-bot@users.noreply.github.com"
            git add state
            git commit -q -m "stato: classifica"
            git pull -q --rebase origin main || true
            git push -q origin HEAD:main || true
          fi
